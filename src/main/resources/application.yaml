spring:
  application:
    name: surest-member-management

  datasource:
    url: jdbc:postgresql://localhost:5432/surestdb
    username: postgres
    password: Krishna@92
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
